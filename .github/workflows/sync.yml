name: Sync
on:
  schedule:
    # Singapore weekdays: 00:00-07:59 SGT (previous UTC day 16:00-23:59)
    - cron: '5/5 16-23 * * 0-4'
    # Singapore weekdays: 08:00-23:59 SGT (same UTC day 00:00-15:59)
    - cron: '5/5 0-15 * * 1-5'
  workflow_dispatch:
  repository_dispatch:
    types: [stkref-refresh]
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync.yml'
permissions:
  contents: write
concurrency:
  group: sync
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download
        run: |
          set -euo pipefail
          tempdir="$(mktemp -d)"
          trap 'rm -rf "$tempdir"' EXIT
          curl --fail --silent --show-error --location 'https://raw.githubusercontent.com/sgkjeajk/stkref/main/market-data.json' --output "$tempdir/market-data.json"
          curl --fail --silent --show-error --location 'https://raw.githubusercontent.com/sgkjeajk/stkref/main/dividend-data.json' --output "$tempdir/dividend-data.json"
          cp "$tempdir/market-data.json" market-data.json
          cp "$tempdir/dividend-data.json" dividend-data.json
      - name: Record source and copy timestamps
        run: |
          python - <<'PY'
          import datetime as dt, json
          from pathlib import Path
          market = json.loads(Path('market-data.json').read_text(encoding='utf-8'))
          dividends = json.loads(Path('dividend-data.json').read_text(encoding='utf-8'))
          status_path = Path('refresh-sync-status.json')
          try:
              previous = json.loads(status_path.read_text(encoding='utf-8'))
          except (OSError, ValueError):
              previous = {}
          market_stamp = market.get('generated_at')
          dividend_stamp = dividends.get('generated_at')
          changed = (previous.get('source_market_generated_at') != market_stamp
                     or previous.get('source_dividend_generated_at') != dividend_stamp)
          if changed:
              status = {
                  'source_market_generated_at': market_stamp,
                  'source_dividend_generated_at': dividend_stamp,
                  'copied_at': dt.datetime.now(dt.timezone.utc).isoformat().replace('+00:00', 'Z'),
              }
              status_path.write_text(json.dumps(status, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Save
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add market-data.json dividend-data.json refresh-sync-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update monitor data'
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo 'No data changes.'
          fi
